services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yyglobal
      POSTGRES_USER: yyglobal
      POSTGRES_PASSWORD: yyglobal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yyglobal -d yyglobal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: production
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOCAL_OWNER_ID: ${LOCAL_OWNER_ID:-local-admin}
      DATABASE_URL: postgresql+asyncpg://yyglobal:yyglobal@db:5432/yyglobal
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_REASONING_MODEL: ${DASHSCOPE_REASONING_MODEL:-qwen-plus}
      DASHSCOPE_EXTRACTION_MODEL: ${DASHSCOPE_EXTRACTION_MODEL:-qwen-vl-plus}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      LLM_DEFAULT_REASONING_EFFORT: ${LLM_DEFAULT_REASONING_EFFORT:-medium}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_REASONING_MODEL: ${LLM_REASONING_MODEL:-gpt-5.6-terra}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-gpt-5.6-luna}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-30}
      AGENT_MAX_TOOL_RETRIES: ${AGENT_MAX_TOOL_RETRIES:-2}
      AGENT_CONTEXT_TOKEN_BUDGET: ${AGENT_CONTEXT_TOKEN_BUDGET:-40000}
      AGENT_TRACE_RETENTION_DAYS: ${AGENT_TRACE_RETENTION_DAYS:-30}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      OFFICIAL_FETCH_TIMEOUT_SECONDS: ${OFFICIAL_FETCH_TIMEOUT_SECONDS:-20}
      OFFICIAL_FETCH_USER_AGENT: ${OFFICIAL_FETCH_USER_AGENT:-YYGlobalBot/0.1 (+educational prototype)}
      CORS_ORIGINS_CSV: ${CORS_ORIGINS_CSV:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
